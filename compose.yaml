services:
  postgres:
    container_name: postgres
    image: postgres:16.3-alpine3.20
    env_file:
      - path: ./back-end/.env
        required: true
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  fastapi:
    build: ./back-end
    ports:
      - "8000:8000"
    env_file:
      - path: ./back-end/.env
        required: true
    environment:
      - POSTGRES_HOST=postgres
    depends_on:
      - postgres

  react:
    build: ./front-end
    container_name: react-container
    ports:
      - '5173:5173'
    volumes:
      - ./front-end/src/:/app/src/
    stdin_open: true
    tty: true

volumes:
  pgdata:

services:
  postgres:
    image: postgres:16.8-alpine3.20
    env_file:
      - path: ./back-end/.env
        required: false
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cheburek_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run ./setup.sh to generate local secrets before starting Compose}

    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  fastapi:
    build: ./back-end
    ports:
      - "${BACKEND_PORT:-8091}:${BACKEND_PORT:-8091}"
    env_file:
      - path: ./back-end/.env
        required: false
    environment:
      APP_CONFIG__RUN__HOST: 0.0.0.0
      APP_CONFIG__RUN__PORT: ${BACKEND_PORT:-8091}
      APP_CONFIG__DB__URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Run ./setup.sh to generate local secrets before starting Compose}@postgres:5432/${POSTGRES_DB:-cheburek_db}
      APP_CONFIG__DB__TEST_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Run ./setup.sh to generate local secrets before starting Compose}@postgres:5432/${POSTGRES_TEST_DB:-test_db}
      APP_CONFIG__DB__ECHO: ${APP_CONFIG__DB__ECHO:-0}
      APP_CONFIG__ACCESS_TOKEN__LIFETIME_SECONDS: ${ACCESS_TOKEN_LIFETIME_SECONDS:-2592000}
      APP_CONFIG__ACCESS_TOKEN__RESET_PASSWORD_TOKEN_SECRET: ${RESET_PASSWORD_TOKEN_SECRET:?Run ./setup.sh to generate local secrets before starting Compose}
      APP_CONFIG__ACCESS_TOKEN__VERIFICATION_TOKEN_SECRET: ${VERIFICATION_TOKEN_SECRET:?Run ./setup.sh to generate local secrets before starting Compose}
      APP_CONFIG__MONGO_DB__HOST: mongo
      APP_CONFIG__MONGO_DB__PORT: 27017
      APP_CONFIG__MONGO_DB__DATABASE_NAME: ${MONGO_DATABASE_NAME:-cheburek_mongo_db}
      APP_CONFIG__MONGO_DB__TEST_DATABASE_NAME: ${MONGO_TEST_DATABASE_NAME:-test_cheburek_mongo_db}
      APP_CONFIG__REDIS__HOST: redis
      APP_CONFIG__REDIS__PORT: 6379
      APP_CONFIG__REDIS__DB: ${REDIS_DB:-0}
      APP_CONFIG__MEDIA__ENDPOINT: minio:9000
      APP_CONFIG__MEDIA__ACCESS_KEY: ${MINIO_ROOT_USER:?Run ./setup.sh to generate local media credentials before starting Compose}
      APP_CONFIG__MEDIA__SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Run ./setup.sh to generate local media credentials before starting Compose}
      APP_CONFIG__MEDIA__BUCKET: ${MINIO_BUCKET:-cheburek-product-images}
      APP_CONFIG__MEDIA__PUBLIC_BASE_URL: http://${LOCAL_BACKEND_DOMAIN:-api.local.cheburek-shop.com}/media
      APP_CONFIG__MEDIA__SECURE: "false"
      APP_CONFIG__MEDIA__MAX_IMAGE_UPLOAD_MB: ${MAX_IMAGE_UPLOAD_MB:-5}
      APP_CONFIG__CURRENCY__BASE_CURRENCY: UAH
      APP_CONFIG__CURRENCY__DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-UAH}
      APP_CONFIG__CURRENCY__SUPPORTED_CURRENCIES: ${SUPPORTED_CURRENCIES:-UAH,USD,EUR}
      APP_CONFIG__CURRENCY__CURRENCY_RATES: ${CURRENCY_RATES:-UAH:1,USD:0.024,EUR:0.022}
      APP_CONFIG__CURRENCY__CURRENCY_SYMBOLS: ${CURRENCY_SYMBOLS:-UAH:₴,USD:$$,EUR:€}
      APP_CONFIG__PRODUCT_LANGUAGES__SUPPORTED_LANGUAGES: ${PRODUCT_LANGUAGES:-en,ukr}
      APP_CONFIG__PRODUCT_LANGUAGES__AUTO_TRANSLATE_PRODUCTS: ${AUTO_TRANSLATE_PRODUCTS:-true}
      APP_CONFIG__TRANSLATION__ENABLED: ${TRANSLATION_ENABLED:-true}
      APP_CONFIG__TRANSLATION__BASE_URL: http://translator:5000
      APP_CONFIG__TRANSLATION__TIMEOUT_SECONDS: ${TRANSLATION_TIMEOUT_SECONDS:-3}
      APP_CONFIG__TRANSLATION__SOURCE_LANGUAGE: ${TRANSLATION_SOURCE_LANGUAGE:-en}
      APP_CONFIG__SESSION__SECRET_KEY: ${SESSION_SECRET_KEY:?Run ./setup.sh to generate local secrets before starting Compose}
      APP_CONFIG__CORS__ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://app.local.cheburek-shop.com,http://admin.local.cheburek-shop.com,http://app.local.cheburek-shop.com:5178,http://admin.local.cheburek-shop.com:5178,http://localhost:5178,http://127.0.0.1:5178,http://react:5178}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Run ./setup.sh to generate local admin credentials before starting Compose}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Run ./setup.sh to generate local admin credentials before starting Compose}
    volumes:
      - ./back-end/app:/backend/app
      - ./back-end/migrations/alembic:/backend/migrations/alembic
      - ./back-end/migrations/beanie_migrations:/backend/migrations/beanie_migrations
      - ./back-end/pyproject.toml:/backend/pyproject.toml
      - ./back-end/poetry.lock:/backend/poetry.lock
      - ./back-end/alembic.ini:/backend/alembic.ini
      - ./back-end/.flake8:/backend/.flake8
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      translator:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import os, urllib.request; urllib.request.urlopen(''http://127.0.0.1:'' + os.environ.get(''APP_CONFIG__RUN__PORT'', ''8091'') + ''/health'', timeout=5).read()"'
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 20s
    stdin_open: true
    tty: true

  react:
    build: ./front-end
    ports:
      - "${FRONTEND_PORT:-5178}:${FRONTEND_PORT:-5178}"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://api.local.cheburek-shop.com/api/v1}
      VITE_DEV_SERVER_HOST: 0.0.0.0
      VITE_DEV_SERVER_PORT: ${FRONTEND_PORT:-5178}
      VITE_DEV_ALLOWED_HOSTS: ${VITE_DEV_ALLOWED_HOSTS:-app.local.cheburek-shop.com,admin.local.cheburek-shop.com,localhost,127.0.0.1}
    volumes:
      - ./front-end/src/:/app/src/
    stdin_open: true
    tty: true
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'node -e "fetch(''http://127.0.0.1:'' + (process.env.VITE_DEV_SERVER_PORT || ''5178'')).then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"'
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 20s

  local-proxy:
    image: nginx:1.27-alpine
    ports:
      - "${LOCAL_HTTP_PORT:-80}:80"
    environment:
      LOCAL_FRONTEND_DOMAIN: ${LOCAL_FRONTEND_DOMAIN:-app.local.cheburek-shop.com}
      LOCAL_BACKEND_DOMAIN: ${LOCAL_BACKEND_DOMAIN:-api.local.cheburek-shop.com}
      LOCAL_ADMIN_DOMAIN: ${LOCAL_ADMIN_DOMAIN:-admin.local.cheburek-shop.com}
      FRONTEND_PORT: ${FRONTEND_PORT:-5178}
      BACKEND_PORT: ${BACKEND_PORT:-8091}
    volumes:
      - ./infra/local-proxy/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      react:
        condition: service_healthy
      fastapi:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - 'wget -q -O /dev/null --header "Host: $${LOCAL_BACKEND_DOMAIN}" http://127.0.0.1/health'
      interval: 10s
      timeout: 6s
      retries: 20
      start_period: 10s

  translator:
    build: ./infra/translator
    ports:
      - "${TRANSLATOR_PORT:-5001}:5000"
    environment:
      TRANSLATOR_HOST: 0.0.0.0
      TRANSLATOR_PORT: 5000
    healthcheck:
      test:
        - CMD-SHELL
        - 'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:5000/health'', timeout=3).read()"'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  mongo:
    image: mongo:7.0.18
    ports:
      - "${MONGO_PORT:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" | grep 1'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Run ./setup.sh to generate local media credentials before starting Compose}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Run ./setup.sh to generate local media credentials before starting Compose}
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'mc ready local'
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

volumes:
  pgdata:
  mongo-data:
  redis-data:
    driver: local
  minio-data:
    driver: local

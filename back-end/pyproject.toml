[tool.poetry]
name = "app"
version = "0.1.0"
description = ""
authors = ["Oleksandr Pavych <sashpavych@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["all"], version = "^0.136.1"}
uvicorn = "^0.34.3"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.49"}
aiosqlite = "^0.21.0"
alembic = "^1.17.2"
pyjwt = {extras = ["crypto"], version = "^2.12.1"}
bcrypt = "^4.3.0"
python-multipart = "^0.0.27"
cryptography = "^46.0.7"
asyncpg = "^0.31.0"
fastapi-users = {extras = ["sqlalchemy"], version = "^15.0.5"}
motor = "^3.7.1"
beanie = "^1.30.0"
redis = "^5.3.1"
dill = "^0.3.9"
pydantic-settings = "^2.14.1"
orjson = "^3.11.9"


[tool.poetry.group.dev.dependencies]
black = "^26.3.1"
flake8 = "^7.0.0"
pytest = "^9.0.3"
pre-commit = "^3.7.1"
pytest-asyncio = "^1.3.0"
pytest-cov = "^5.0.0"
pip-audit = "^2.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=. --cov-report=term-missing"
filterwarnings = [
    # Beanie 1.30 pins lazy-model 0.2.0, which emits this Pydantic 2.11
    # deprecation during linked-document parsing. Keep this scoped until the
    # project is ready for a Beanie 2.x migration.
    "ignore:Accessing the 'model_fields' attribute on the instance is deprecated.*:pydantic.warnings.PydanticDeprecatedSince211:lazy_model.parser.new",
]
